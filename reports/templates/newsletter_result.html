<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Policy Newsletter — CIPRB M&E</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Source Sans 3', sans-serif; background: #F5F7FA; margin: 0; padding: 32px 20px; color: #2D3748; }
        .wrap { max-width: 720px; margin: 0 auto; }
        .header { background: #1A3668; padding: 24px 32px; border-radius: 6px 6px 0 0; }
        .header h1 { color: white; font-size: 1.3rem; font-weight: 700; margin: 0 0 4px; }
        .header p { color: rgba(255,255,255,0.65); font-size: 0.82rem; margin: 0; }
        .meta { background: #009EDB; padding: 10px 32px; color: white; font-size: 0.78rem; }
        .content { background: white; border: 1px solid #E2E8F0; border-top: none; padding: 32px; border-radius: 0 0 6px 6px; }
        .content p { line-height: 1.7; margin-bottom: 16px; font-size: 0.95rem; }
        .back { margin-top: 24px; }
        .back a { color: #009EDB; text-decoration: none; font-size: 0.85rem; }
        .print-btn { float: right; background: #009EDB; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-size: 0.8rem; font-weight: 700; cursor: pointer; font-family: inherit; }
        @media print { .print-btn, .back { display: none; } body { background: white; padding: 0; } }
    </style>
</head>
<body>
<div class="wrap">
    <div class="header">
        <button class="print-btn" onclick="window.print()">Print / Save PDF</button>
        <h1>Policy Advocacy Newsletter</h1>
        <p>CIPRB M&E · UNFPA-SRHR/RCH Programme</p>
    </div>
    <div class="meta">
        Generated for {{ newsletter.month }}/{{ newsletter.year }} · {{ newsletter.created_at|date:"d M Y, H:i" }} UTC
    </div>
    <div class="content">
        {{ newsletter.content|linebreaks }}
    </div>
    <div class="back">
        <a href="{% url 'dashboard_main' %}">← Back to Dashboard</a>
        &nbsp;·&nbsp;
        <a href="{% url 'report_archive' %}">Report Archive</a>
    </div>
</div>
</body>
</html>
